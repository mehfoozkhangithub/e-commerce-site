<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Page Layout</title>
    <link rel="stylesheet" href="./footer.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
    <footer class="main-footer">
        
    <div class="content-container">
        <section class="contact-form-section">
            <h2 class="form-title">Tell me about your project</h2>
            <hr class="underline">
            <form action="#" method="POST" class="contact-form">
                <div class="input-row">
                    <input type="text" name="name" placeholder="Name" required>
                    <input type="email" name="email" placeholder="Email Address" required>
                </div>
                <textarea name="message" placeholder="Message description" rows="10" required></textarea>
                <button class="send-button">Send</button>
            </form>
        </section>
    </div>

        <div class="footer-content">
            <span class="footer-logo">IWMYWF</span>
            <span class="footer-copyright">&copy; Copyright 2021. All right reserved</span>
            <div class="social-links">
                <span class="connect-text">Connect with me:</span>
                <a href="#"><i class="fab fa-facebook-f"></i></a>
                <a href="#"><i class="fab fa-twitter"></i></a>
                <a href="#"><i class="fab fa-github"></i></a>
            </div>
        </div>
    </footer>

</body>
</html>
